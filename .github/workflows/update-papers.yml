name: 自动更新文献数据

on:
  schedule:
    # 每周一 02:30 UTC（北京时间 10:30）
    - cron: "30 2 * * 1"
  workflow_dispatch: {}   # 可在 Actions 页手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取最新文献（OpenAlex）
        run: python scripts/fetch_papers.py
        env:
          # 可选：填入邮箱进入 polite pool 提高限流（未设置也不影响运行）
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}

      - name: 应用 WoS 校准覆盖层（被引次数 / JCR 分区）
        # OpenAlex 每次会重写所抓取文献的字段，被 WoS 校准过的值会被冲掉；
        # 此步骤用 data/wos_overlay.json（随仓库提交）恢复校准值
        run: python scripts/import_wos.py --apply

      - name: 翻译标题与摘要（中文化）
        run: python scripts/translate_papers.py

      - name: 生成统计与知识关系图
        run: python scripts/build_data.py

      - name: 提交数据变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 运行期间远程可能被其他提交推进：先同步到最新，再在其上提交，避免 push 被拒
          # （checkout 是分离 HEAD，用 rebase 而非 pull；数据文件与代码提交不重叠，不会冲突）
          git fetch origin main
          git rebase --autostash origin/main
          git add data/
          if git diff --cached --quiet; then
            echo "无数据变更，跳过提交"
          else
            git commit -m "data: weekly literature update $(date -u +%Y-%m-%d)"
            git push
          fi
